<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>꼬물꼬물 · 지렁이 정원</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f2e9;color:#263d32;font-family:system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:28px 22px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #d9dfcf;padding-bottom:18px}.brand{font-weight:800;letter-spacing:2px;font-size:13px}.tag{font-size:12px;border:1px solid #bbc9b6;border-radius:30px;padding:7px 12px}.intro{margin:28px 0 20px}.intro small{color:#71876c;letter-spacing:3px}h1{font-size:clamp(30px,6vw,48px);margin:9px 0}p{color:#6b776c;line-height:1.65}.layout{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:24px}.board{position:relative;overflow:hidden;border:8px solid #fffdf6;border-radius:24px;box-shadow:0 12px 35px #2d463310;aspect-ratio:1}canvas{display:block;width:100%;height:100%;touch-action:none;background:#e1e9d6}.overlay{position:absolute;inset:0;background:#e8eedde8;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}.overlay[hidden]{display:none}.sprout{font-size:58px}h2{font-size:27px;margin:12px 0}button,select{font:inherit}button{cursor:pointer;border:0;border-radius:14px;background:#315c40;color:white;padding:14px 22px;font-weight:700}button:focus-visible,select:focus-visible{outline:3px solid #d59945;outline-offset:3px}aside{display:flex;flex-direction:column;gap:14px}.card{background:#fffdf6;border:1px solid #e1e3d6;border-radius:20px;padding:20px}.stats{display:flex;justify-content:space-between}.label{font-size:12px;color:#788673}.number{font-size:34px;font-weight:800;margin-top:5px}.best{color:#a5844d}.select{width:100%;margin-top:10px;border:1px solid #c8d3bf;padding:10px;border-radius:10px;background:transparent;color:#31543b}.secondary{background:#e1e8d8;color:#31543b;width:100%}.pad{display:grid;grid-template-columns:repeat(3,54px);gap:6px;justify-content:center;margin:16px 0}.pad button{padding:12px 0;background:#fffdf6;color:#31543b;border:1px solid #cdd8c4;font-size:22px;touch-action:manipulation}.pad button:first-child{grid-column:2}.pad button:nth-child(2){grid-column:1}.help{font-size:13px;margin:0}.foot{font-size:12px;color:#83907d;margin:22px 0;text-align:center} @media(max-width:700px){main{padding:18px 14px}.layout{grid-template-columns:1fr}.intro{margin:20px 0 16px}.intro p{margin:8px 0}aside{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{padding:14px}.controls{grid-column:1/-1}.pad{margin:8px 0}.foot{margin:12px}header{padding-bottom:12px}}
</style></head><body><main><header><span class="brand">🌱 LITTLE GARDEN</span><span class="tag">작은 정원, 작은 모험</span></header><section class="intro"><small>WORM GARDEN</small><h1>꼬물꼬물 지렁이</h1><p>사과를 먹고 쑥쑥 자라요. 벽과 내 몸은 조심하세요!</p></section><div class="layout"><div><div class="board"><canvas id="game" width="600" height="600" aria-label="지렁이 게임판"></canvas><div class="overlay" id="overlay"><div><div class="sprout" id="icon">🌱</div><h2 id="title">정원으로 떠나볼까요?</h2><p id="message">사과 하나에 10점! 얼마나 길어질 수 있을까요?</p><button id="start">게임 시작 →</button></div></div></div><div class="pad" aria-label="방향 조작"><button data-dir="up" aria-label="위">↑</button><button data-dir="left" aria-label="왼쪽">←</button><button data-dir="down" aria-label="아래">↓</button><button data-dir="right" aria-label="오른쪽">→</button></div></div><aside><div class="card stats" aria-live="polite"><div><div class="label">현재 점수</div><div class="number" id="score">0</div></div><div><div class="label">최고 기록</div><div class="number best" id="best">0</div></div></div><div class="card"><label class="label" for="speed">정원의 속도</label><select class="select" id="speed"><option value="180">느긋하게</option><option value="125" selected>보통으로</option><option value="80">빠르게</option></select><p class="help">속도를 바꾸면 다음 게임부터 적용돼요.</p></div><div class="card controls"><button class="secondary" id="pause">일시정지 Ⅱ</button><p class="help" style="margin-top:15px">👆 방향 버튼 또는 화면 스와이프<br>⌨ 방향키 / WASD · 스페이스로 잠시 쉬기</p></div></aside></div><div class="foot">천천히, 조금씩 길어지는 즐거움.</div></main><script src="game.js"></script></body></html>
